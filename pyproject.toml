[project]
name = "hoopql"
version = "0.1.0"
description = "Natural-language queries over NBA player game logs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "nba-api>=1.11.4",
    "psycopg[binary]>=3.3.6",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "app", "etl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
