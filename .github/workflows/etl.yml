name: etl

on:
  schedule:
    # 08:00 UTC, after West Coast games have finished.
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Load games since the last successful run
        env:
          ETL_DATABASE_URL: ${{ secrets.ETL_DATABASE_URL }}
        run: uv run python -m etl.daily

      - name: Open an issue when the load fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly ETL failed (${context.runId})`,
              body: `The scheduled game-log load failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
